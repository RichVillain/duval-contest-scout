<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Duval Contest Scout</title>
  <style>
    :root { --bg:#101014; --panel:#1a1a21; --panel-2:#23232c; --line:#32323c; --text:#f4f1ea; --muted:#a8a29a; --gold:#e8b84a; --green:#4ade80; --blue:#7dd3fc; --chip:#2c2c36; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
    header { padding:20px 24px 8px; display:flex; flex-wrap:wrap; gap:12px 24px; justify-content:space-between; border-bottom:1px solid var(--line); }
    .kicker { color:var(--gold); letter-spacing:.14em; font-size:11px; font-weight:700; text-transform:uppercase; }
    h1 { margin:4px 0 0; font-size:28px; }
    .sub,.muted { color:var(--muted); }
    .links a { color:var(--gold); text-decoration:none; margin-left:14px; font-size:14px; }
    .wrap { padding:20px 24px 64px; max-width:1280px; margin:0 auto; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
    .kpi { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
    .kpi b { display:block; font-size:28px; }
    .kpi span { color:var(--muted); font-size:12px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 12px; }
    input[type=search] { flex:1; min-width:200px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:10px 14px; font:inherit; }
    .filter { background:var(--chip); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font:inherit; cursor:pointer; }
    .filter[aria-pressed="true"] { background:var(--gold); color:#1a1404; font-weight:700; }
    .grid { display:grid; grid-template-columns:1.4fr .8fr; gap:16px; }
    @media (max-width:900px){ .grid { grid-template-columns:1fr; } }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
    h2 { font-size:16px; margin:0 0 12px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:6px 8px; }
    td { padding:8px; border-top:1px solid var(--line); vertical-align:top; }
    .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; background:var(--panel-2); margin-right:4px; }
    .tag.cash { color:var(--green); } .tag.tickets { color:var(--blue); } .tag.online { color:var(--gold); }
    .play { background:var(--panel-2); border-radius:12px; padding:12px; margin-bottom:10px; }
    .warn { background:#2a171a; border:1px solid #5a2430; color:#fecdd3; border-radius:12px; padding:12px 14px; margin:16px 0; }
    select.status { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 6px; font:inherit; }
    a { color:var(--gold); }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="kicker">Admin dashboard</div>
      <h1>Duval Contest Scout</h1>
      <p class="sub" id="metaLine"></p>
    </div>
    <div class="links">
      <a href="../public/index.html">Public radar</a>
      <a href="https://muse.ai/s/duval-contest-scout-zy66xaxl99xpxwxv" target="_blank" rel="noopener">Muse source</a>
    </div>
  </header>
  <main class="wrap">
    <div class="kpis" id="kpis"></div>
    <div class="warn" id="shield"></div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search prize, station, venue…" />
      <button class="filter" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" data-filter="black">Black Radio</button>
      <button class="filter" data-filter="mainstream">Mainstream</button>
      <button class="filter" data-filter="cash">Cash</button>
      <button class="filter" data-filter="tickets">Tickets</button>
      <button class="filter" data-filter="online">Enter online</button>
      <button class="filter" data-filter="text">Text</button>
    </div>
    <div class="grid">
      <section class="panel">
        <h2>Easy-read listings <span class="muted" id="countLabel"></span></h2>
        <div style="overflow:auto"><table><thead><tr><th>Prize</th><th>Station</th><th>How</th><th>Track</th></tr></thead><tbody id="rows"></tbody></table></div>
      </section>
      <aside>
        <section class="panel" style="margin-bottom:16px"><h2>Play now</h2><div id="playNow"></div></section>
        <section class="panel" style="margin-bottom:16px"><h2>Win rules decoder</h2><ul class="muted" id="rules"></ul></section>
        <section class="panel"><h2>Station radar</h2><div id="stations"></div></section>
      </aside>
    </div>
  </main>
  <script src="../data/scout-core.js"></script>
  <script src="../data/stations/WJBT.js"></script>
  <script src="../data/stations/WSOL.js"></script>
  <script src="../data/stations/WHJX.js"></script>
  <script src="../data/stations/WKSL.js"></script>
  <script src="../data/stations/WQIK.js"></script>
  <script src="../data/stations/WAPE.js"></script>
  <script src="../data/stations/WJGL.js"></script>
  <script src="../data/stations/WEJZ.js"></script>
  <script src="../data/stations/REGISTRY-GAP.js"></script>
  <script>window.SCOUT_DATA = {meta: window.SCOUT_META, stations: window.SCOUT_STATIONS};</script>
  <script>
    const DATA = window.SCOUT_DATA;
    const meta = DATA.meta;
    const stations = DATA.stations;
    const listings = [];
    stations.forEach(s => (s.contests||[]).forEach((c,i) => {
      const tags = (c[1]||"").toLowerCase();
      listings.push({
        id: s.call+"-"+(i+1), stationCall:s.call, stationName:s.name, frequency:s.frequency,
        audience:s.audience, owner:s.owner, title:c[0], tags,
        cash: tags.includes("cash"), tickets: tags.includes("ticket"),
        online: tags.includes("online"), text: tags.includes("text"),
        notes: c.slice(2), contestsUrl:s.contestsUrl, phone:s.phone, textLine:s.text
      });
    }));
    const trackKey = "dcs-admin-track-v1";
    const track = JSON.parse(localStorage.getItem(trackKey)||"{}");
    const esc = v => String(v??"").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    document.getElementById("metaLine").textContent = listings.length+" verified listings · "+meta.stationPages+" station pages · verified "+meta.verified+" · dashboard "+meta.dashboardUpdated;
    document.getElementById("shield").textContent = "Scam shield — "+meta.scamShield;
    const n = k => listings.filter(k).length;
    document.getElementById("kpis").innerHTML = [
      ["Listings", listings.length],["Stations", meta.stationPages+"+1 gap"],
      ["Tickets", n(r=>r.tickets)],["Cash", n(r=>r.cash)],["Online", n(r=>r.online)],["Text", n(r=>r.text)]
    ].map(([l,v])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
    document.getElementById("rules").innerHTML = `<li><b style="color:var(--text)">iHeart lockout:</b> ${esc(meta.iheartLockout)}</li><li><b style="color:var(--text)">Pickup:</b> ${esc(meta.iheartPickup)}. ID, W-9, prize form. No mail. Winner pays tax.</li><li>A win on 93.3 The Beat locks out V101.5, KISS FM and 99.1 WQIK for 30 days.</li><li>Cox: listen for the cue, be the correct caller.</li><li>WEJZ online: one entry; Promotions contacts winners.</li><li>No auto-dial. Never pay or enter card data.</li>`;
    document.getElementById("playNow").innerHTML = listings.filter(r=>r.cash||r.text).slice(0,4).map(r=>`<div class="play"><strong>${esc(r.title)}</strong><div class="muted">${esc(r.frequency)} ${esc(r.stationName)} · ${esc(r.tags)}</div><div class="muted">${(r.notes||[]).map(esc).join(" · ")}</div>${r.textLine?`<div><a href="${esc(r.textLine.href)}">Text ${esc(r.textLine.display)}</a></div>`:""}${r.phone?`<div><a href="${esc(r.phone.href)}">Call ${esc(r.phone.display)}</a></div>`:""}${r.contestsUrl?`<div><a href="${esc(r.contestsUrl)}" target="_blank" rel="noopener">Official page</a></div>`:""}</div>`).join("");
    document.getElementById("stations").innerHTML = stations.map(s=>`<div class="play"><strong>${esc(s.frequency)} ${esc(s.name)}</strong><div class="muted">${esc(s.call)} · ${esc(s.owner)} · ${(s.contests||[]).length} listings</div>${s.note?`<div class="muted">${esc(s.note)}</div>`:""}</div>`).join("");
    let filter="all"; const q=document.getElementById("q");
    document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(b=>b.setAttribute("aria-pressed","false"));btn.setAttribute("aria-pressed","true");filter=btn.dataset.filter;render();}));
    q.addEventListener("input", render);
    function match(r){
      const query=q.value.trim().toLowerCase();
      const hay=[r.title,r.stationName,r.stationCall,r.frequency,r.tags,...(r.notes||[])].join(" ").toLowerCase();
      if(query && !hay.includes(query)) return false;
      if(filter==="all") return true;
      if(filter==="black") return r.audience==="black";
      if(filter==="mainstream") return r.audience==="mainstream";
      return !!r[filter];
    }
    function render(){
      const shown=listings.filter(match);
      document.getElementById("countLabel").textContent="· "+shown.length;
      document.getElementById("rows").innerHTML=shown.map(r=>`<tr><td><strong>${esc(r.title)}</strong><div class="muted">${(r.notes||[]).map(esc).join(" · ")}</div></td><td>${esc(r.frequency)}<br>${esc(r.stationCall)}</td><td>${r.cash?'<span class="tag cash">cash</span>':''}${r.tickets?'<span class="tag tickets">tickets</span>':''}${r.online?'<span class="tag online">online</span>':''}${r.text?'<span class="tag">text</span>':''}${r.contestsUrl?`<div><a href="${esc(r.contestsUrl)}" target="_blank" rel="noopener">source</a></div>`:''}</td><td><select class="status" data-id="${esc(r.id)}">${["watch","entered","won","skip","confirm"].map(st=>`<option ${track[r.id]===st?"selected":""}>${st}</option>`).join("")}</select></td></tr>`).join("");
      document.querySelectorAll("select.status").forEach(sel=>sel.addEventListener("change",()=>{track[sel.dataset.id]=sel.value;localStorage.setItem(trackKey,JSON.stringify(track));}));
    }
    render();
  </script>
</body>
</html>
