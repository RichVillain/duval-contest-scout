<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duval Contest Scout</title>
  <style>
    :root { --bg:#f4f1e8; --surface:#fffdf7; --line:#d6cdbb; --text:#15130f; --muted:#655e51; --gold:#8d6900; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Georgia, serif; background:var(--bg); color:var(--text); }
    header, main { max-width:820px; margin:0 auto; padding:24px 20px; }
    .kicker { color:var(--gold); letter-spacing:.16em; font-size:12px; font-weight:700; text-transform:uppercase; font-family:system-ui,sans-serif; }
    h1 { font-size:clamp(32px,7vw,56px); line-height:.95; margin:8px 0 10px; }
    .lede,.muted { color:var(--muted); }
    nav { display:flex; gap:8px; flex-wrap:wrap; font-family:system-ui,sans-serif; }
    .filter { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 12px; cursor:pointer; }
    .filter[aria-pressed="true"] { background:#1c1608; color:#f6ecd2; }
    .station { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; margin:14px 0; }
    .station.hidden,.contest.hidden { display:none; }
    .freq { font-family:system-ui,sans-serif; color:var(--gold); font-weight:700; font-size:13px; }
    h2 { margin:4px 0 6px; font-size:28px; }
    .contest { border-top:1px solid var(--line); padding:10px 0; }
    .actions a { margin-right:10px; color:var(--gold); font-family:system-ui,sans-serif; }
    .warn { background:#2b1a12; color:#f8e6d6; border-radius:14px; padding:12px 14px; font-family:system-ui,sans-serif; font-size:14px; }
    .empty { display:none; text-align:center; color:var(--muted); padding:24px; }
  </style>
</head>
<body>
  <header>
    <div class="kicker">Jacksonville contest intelligence</div>
    <h1>DUVAL CONTEST SCOUT</h1>
    <p class="lede">Verified cues. Verified numbers. One radar.</p>
    <p class="muted" id="stats"></p>
    <nav id="filters">
      <button class="filter" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" data-filter="black">Black Radio</button>
      <button class="filter" data-filter="mainstream">Mainstream</button>
      <button class="filter" data-filter="cash">Cash</button>
      <button class="filter" data-filter="tickets">Tickets</button>
      <button class="filter" data-filter="online">Enter Online</button>
    </nav>
    <p class="muted" id="resultCount"></p>
  </header>
  <main>
    <div class="warn" id="shield"></div>
    <div id="stations"></div>
    <p class="empty" id="empty">No verified listings match that filter.</p>
    <p class="muted" id="foot"></p>
  </main>
  <script src="../data/scout-core.js"></script>
  <script>window.SCOUT_DATA = {meta: window.SCOUT_META, stations: window.SCOUT_STATIONS};</script>
  <script>
    const {meta, stations} = window.SCOUT_DATA;
    const esc = v => String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const n = stations.reduce((a,s)=>a+(s.contests||[]).length,0);
    document.getElementById("stats").textContent = n+" verified listings · Verified "+meta.verified+" · "+meta.stationPages+"+1 station registry";
    document.getElementById("shield").textContent = meta.scamShield;
    document.getElementById("foot").textContent = "Private build for "+meta.owner+". Muse source "+meta.verified+". Dashboard "+meta.dashboardUpdated+".";
    document.getElementById("resultCount").textContent = "Showing verified listings + one open registry question";
    document.getElementById("stations").innerHTML = stations.map(s=>{
      const phone=s.phone?`<a href="${esc(s.phone.href)}">${esc(s.phone.label)} ${esc(s.phone.display)}</a>`:"";
      const text=s.text?`<a href="${esc(s.text.href)}">${esc(s.text.label)} ${esc(s.text.display)}</a>`:"";
      const page=s.contestsUrl?`<a href="${esc(s.contestsUrl)}" target="_blank" rel="noopener">Official contests</a>`:"";
      const contests=(s.contests||[]).map(c=>{
        const tags=(c[1]||"").toLowerCase();
        return `<div class="contest" data-audience="${esc(s.audience)}" data-cash="${tags.includes("cash")}" data-tickets="${tags.includes("ticket")}" data-online="${tags.includes("online")}"><strong>${esc(c[0])}</strong><div class="muted">${esc(tags)}${c.slice(2).map(x=>" · "+esc(x)).join("")}</div></div>`;
      }).join("");
      return `<article class="station" data-station-audience="${esc(s.audience)}"><div class="freq">${esc(s.frequency)} · ${esc(s.call)} · ${esc(s.owner)}</div><h2>${esc(s.name)}</h2><div class="muted">${esc(s.format||"")}</div><div class="actions">${phone}${text}${page}</div>${s.pickup?`<p class="muted">${esc(s.pickup)}</p>`:""}${s.note?`<p class="muted">${esc(s.note)}</p>`:""}${contests}</article>`;
    }).join("");
    const emptyEl=document.getElementById("empty");
    const filters=[...document.querySelectorAll(".filter")];
    function apply(filter){
      let shownStations=0, shownContests=0;
      document.querySelectorAll(".station").forEach(stationEl=>{
        let local=0; const unresolved=stationEl.dataset.stationAudience==="unresolved";
        stationEl.querySelectorAll(".contest").forEach(el=>{
          const match=filter==="all"||(filter==="black"&&el.dataset.audience==="black")||(filter==="mainstream"&&el.dataset.audience==="mainstream")||(filter==="cash"&&el.dataset.cash==="true")||(filter==="tickets"&&el.dataset.tickets==="true")||(filter==="online"&&el.dataset.online==="true");
          el.classList.toggle("hidden", !match); if(match){ local++; shownContests++; }
        });
        const show=unresolved?filter==="all":local>0;
        stationEl.classList.toggle("hidden", !show); if(show && !unresolved) shownStations++;
      });
      emptyEl.style.display=shownStations?"none":"block";
      document.getElementById("resultCount").textContent=filter==="all"?"Showing verified listings + one open registry question":`${shownContests} matching listings · ${shownStations} stations`;
    }
    filters.forEach(btn=>btn.addEventListener("click",()=>{filters.forEach(b=>b.setAttribute("aria-pressed","false"));btn.setAttribute("aria-pressed","true");apply(btn.dataset.filter);}));
  </script>
</body>
</html>
